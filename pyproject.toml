[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "droidfoundry"
version = "1.0.0"
description = "Android device bring-up assistant for firmware dumps, device tree skeletons, vendor blob lists, manifests, and maintainer reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manish Kishore" }]
keywords = [
  "android",
  "custom-rom",
  "aosp",
  "lineageos",
  "device-tree",
  "vendor-tree",
  "firmware",
  "rom-development",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/manishkishore92/DroidFoundry"
Repository = "https://github.com/manishkishore92/DroidFoundry"
Issues = "https://github.com/manishkishore92/DroidFoundry/issues"

[project.scripts]
droidfoundry = "droidfoundry.cli:app"
dfoundry = "droidfoundry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["droidfoundry"]

[tool.hatch.build.targets.wheel.force-include]
"droidfoundry/templates" = "droidfoundry/templates"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
